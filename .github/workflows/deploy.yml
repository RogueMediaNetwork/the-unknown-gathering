name: Deploy to Namecheap (cPanel)

# Builds the Vite site and uploads dist/ into public_html over FTPS
# on every push to main. Requires repo secrets:
#   FTP_SERVER   e.g. server289.web-hosting.com  (or ftp.ugcontx.com)
#   FTP_USERNAME your cPanel/FTP user            (e.g. ugcorfki)
#   FTP_PASSWORD the FTP account password
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ to public_html via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.ugcontx.com
          username: ugcorfki
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # 8b89f4ff@ugcontx.com is rooted at the home dir (/home/ugcorfki),
          # so target public_html (the real web root) beneath it.
          server-dir: public_html/
